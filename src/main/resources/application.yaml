spring:
  application:
    name: ${APP_NAME:fap-backend}
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  profiles:
    active: ${APP_ENV:local}
  datasource:
    url: jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:XEPDB1}
    username: ${DB_USERNAME:fap}
    password: ${DB_PASSWORD:12345}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0.1"  # Must be a string < 1 so V1 actually runs; integer 0 defaults to Flyway's built-in baseline of 1
    # repair-on-migrate is NOT supported in Spring Boot 3.4.x FlywayProperties.
    # Repair is handled programmatically via FlywayConfig#flywayMigrationStrategy().
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      # Container-level guard. FileValidator re-checks the size so clients get a documented
      # error code instead of a generic multipart failure.
      max-file-size: ${MAX_UPLOAD_SIZE:20MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:25MB}

server:
  port: ${SERVER_PORT:8080}

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@fap.local}
  password-reset:
    ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:15}
