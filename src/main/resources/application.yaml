spring:
  application:
    name: ${APP_NAME:fap-backend}
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  profiles:
    active: ${APP_ENV:local}
  lifecycle:
    # On SIGTERM, allow in-flight requests to finish before Spring stops dependent beans.
    timeout-per-shutdown-phase: ${SERVER_SHUTDOWN_TIMEOUT:30s}
  datasource:
    url: jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:XEPDB1}
    username: ${DB_USERNAME:fap}
    # No default: a fallback password would let a misconfigured deployment start and fail later
    # at connection time instead of immediately. application-local.yaml supplies the dev default.
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      # Keep the defaults explicit and environment-tunable. Across all replicas, DB_POOL_MAX
      # must stay below the Oracle connection budget after reserving admin/background sessions.
      minimum-idle: ${DB_POOL_MIN:5}
      maximum-pool-size: ${DB_POOL_MAX:20}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_POOL_KEEPALIVE_MS:0}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: "0.1"  # Must be a string < 1 so V1 actually runs; integer 0 defaults to Flyway's built-in baseline of 1
    # repair-on-migrate is NOT supported in Spring Boot 3.4.x FlywayProperties.
    # Repair is handled programmatically via FlywayConfig#flywayMigrationStrategy().
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      # Container-level guard. FileValidator re-checks the size so clients get a documented
      # error code instead of a generic multipart failure.
      max-file-size: ${MAX_UPLOAD_SIZE:20MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:25MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        # prometheus is added for scraping. It is NOT public: SecurityConfig requires
        # authentication for /actuator/** except health. env/beans/heapdump/threaddump stay
        # unexposed per monitoring.md. A deployment behind a proxy should also restrict the
        # path at the network edge, or move actuator to a separate management port.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      # Low-cardinality identity tags so scraped series are attributable per service/env.
      application: ${spring.application.name}
      env: ${APP_ENV:local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true

app:
  jwt:
    # Required. Generate with: openssl rand -base64 48
    secret: ${JWT_SECRET}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@fap.local}
  password-reset:
    ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:15}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Bounded so a source rotating addresses cannot grow the bucket map without limit.
    max-tracked-keys: ${RATE_LIMIT_MAX_KEYS:50000}
    # Must be >= the longest refill-period below, or a bucket is evicted while still drained
    # and the caller silently gets a fresh allowance.
    key-idle-ttl: ${RATE_LIMIT_KEY_IDLE_TTL:30m}
    # Only enable behind a reverse proxy that overwrites X-Forwarded-For. When the app is
    # reachable directly, a client can forge the header and get a fresh bucket per request.
    trust-forward-headers: ${RATE_LIMIT_TRUST_PROXY:false}
    # Matched in order, most specific path first.
    rules:
      # Credential guessing. BCrypt verification is deliberately expensive, so this also caps
      # the CPU an unauthenticated caller can consume.
      - path: /api/v1/auth/login
        method: POST
        capacity: ${RATE_LIMIT_LOGIN_CAPACITY:10}
        refill-period: ${RATE_LIMIT_LOGIN_PERIOD:1m}
      - path: /api/v1/auth/google
        method: POST
        capacity: ${RATE_LIMIT_LOGIN_CAPACITY:10}
        refill-period: ${RATE_LIMIT_LOGIN_PERIOD:1m}
      # OTP brute force: the reset token space is small, so this is the control that keeps it
      # from being enumerated.
      - path: /api/v1/auth/reset-password
        method: POST
        capacity: ${RATE_LIMIT_RESET_CAPACITY:5}
        refill-period: ${RATE_LIMIT_RESET_PERIOD:10m}
      # Mail sending is the cost here, plus user-visible spam to a third party's inbox.
      - path: /api/v1/auth/forgot-password
        method: POST
        capacity: ${RATE_LIMIT_FORGOT_CAPACITY:3}
        refill-period: ${RATE_LIMIT_FORGOT_PERIOD:10m}
      - path: /api/v1/auth/refresh
        method: POST
        capacity: ${RATE_LIMIT_REFRESH_CAPACITY:30}
        refill-period: ${RATE_LIMIT_REFRESH_PERIOD:1m}
